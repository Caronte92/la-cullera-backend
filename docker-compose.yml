version: "3.9"

services:
  api_public:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-public
    container_name: api_public
    ports:
      - "9000:8080"
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=appdb;Username=postgres;Password=postgres

  api_admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-admin
    container_name: api_admin
    ports:
      - "9001:8080"
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=appdb;Username=postgres;Password=postgres

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:

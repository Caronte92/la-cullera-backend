services:
  api_public:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-public
    container_name: api_public
    ports:
      - "9000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_SECRET: dev-only-secret-replace-in-production-min-32-chars!!
      Database__Host: db
      Database__Port: "5432"
      Database__Name: la-cullera
      Database__Username: user
      Database__Password: pass
      ConnectionStrings__Redis: redis_cache:6379

  api_admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-admin
    container_name: api_admin
    ports:
      - "9001:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_SECRET: dev-only-secret-replace-in-production-min-32-chars!!
      Database__Host: db
      Database__Port: "5432"
      Database__Name: la-cullera
      Database__Username: user
      Database__Password: pass
      ConnectionStrings__Redis: redis_cache:6379

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: la-cullera
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d la-cullera"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:

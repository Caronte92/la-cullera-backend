services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api_public
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  api_public:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-public
    container_name: api_public
    ports:
      - "9000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      Database__Host: ${DB_HOST:-db}
      Database__Port: ${DB_PORT:-5432}
      Database__Name: ${DB_NAME}
      Database__Username: ${DB_USER}
      Database__Password: ${DB_PASSWORD}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-redis_cache:6379}
      Cors__Origin: ${Cors__Origin:-http://localhost:3000}

  api_admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-admin
    container_name: api_admin
    ports:
      - "9001:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      Database__Host: ${DB_HOST:-db}
      Database__Port: ${DB_PORT:-5432}
      Database__Name: ${DB_NAME}
      Database__Username: ${DB_USER}
      Database__Password: ${DB_PASSWORD}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-redis_cache:6379}

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
